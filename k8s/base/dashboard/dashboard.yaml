apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-dashboard
  namespace: streaming
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-dashboard
  template:
    metadata:
      labels:
        app: analytics-dashboard
    spec:
      serviceAccountName: dashboard
      containers:
        - name: dashboard
          image: ghcr.io/example/realtime-ecommerce-etl/dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            - name: S3_ENDPOINT
              value: http://minio.streaming.svc.cluster.local:9000
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-credentials
                  key: accessKey
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-credentials
                  key: secretKey
            - name: GOLD_KPI_TABLE
              value: s3://curated-clickstream/gold/realtime_kpis
            - name: QUALITY_ALERTS_TABLE
              value: s3://curated-clickstream/gold/quality_alerts
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-dashboard
  namespace: streaming
spec:
  selector:
    app: analytics-dashboard
  ports:
    - port: 80
      targetPort: 8501
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analytics-dashboard
  namespace: streaming
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics-dashboard
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

