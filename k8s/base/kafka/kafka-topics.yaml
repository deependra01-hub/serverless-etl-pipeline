apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: ecommerce-clickstream-v1
  namespace: streaming
  labels:
    strimzi.io/cluster: ecommerce-kafka
spec:
  topicName: ecommerce.clickstream.v1
  partitions: 24
  replicas: 3
  config:
    cleanup.policy: delete
    min.insync.replicas: 2
    retention.ms: 86400000
    segment.bytes: 1073741824
