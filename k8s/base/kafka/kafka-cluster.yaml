apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: ecommerce-kafka
  namespace: streaming
spec:
  kafka:
    version: 3.8.0
    replicas: 3
    listeners:
      - name: internal
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      min.insync.replicas: 2
      default.replication.factor: 3
      num.partitions: 12
      inter.broker.protocol.version: "3.8"
    storage:
      type: persistent-claim
      size: 200Gi
      deleteClaim: false
      class: standard
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 8Gi
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 20Gi
      deleteClaim: false
      class: standard
    resources:
      requests:
        cpu: "250m"
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: streaming-app
  namespace: streaming
  labels:
    strimzi.io/cluster: ecommerce-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: ecommerce.clickstream.v1
          patternType: literal
        operations: ["Read", "Write", "Describe", "Create"]
      - resource:
          type: topic
          name: ecommerce.orders.v1
          patternType: literal
        operations: ["Read", "Write", "Describe", "Create"]
      - resource:
          type: group
          name: ecommerce-analytics
          patternType: prefix
        operations: ["Read"]

