[project]
name = "realtime-ecommerce-etl"
version = "1.0.0"
description = "Production-grade real-time serverless ETL pipeline with Kafka, Spark Structured Streaming, Kubernetes, and Delta Lake."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.35.0",
  "confluent-kafka>=2.6.0",
  "delta-spark>=3.2.0",
  "deltalake>=0.18.2",
  "fastavro>=1.9.5",
  "kubernetes>=30.1.0",
  "orjson>=3.10.7",
  "pandas>=2.2.3",
  "prometheus-client>=0.20.0",
  "pydantic>=2.8.2",
  "pyyaml>=6.0.2",
  "streamlit>=1.39.0",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23.0",
  "pyspark>=3.5.1",
  "pytest>=8.3.2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "spark/tests"]
pythonpath = [".", "producer", "spark", "dashboard", "orchestrator"]
